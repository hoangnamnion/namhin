<!-- MODAL FULLSCREEN BÓ HOA TÌNH YÊU CỦA HÌN -->
<div id="bouquet-modal" style="
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999999;
  background: #000;
  width: 100vw;
  height: 100vh;
">
  <iframe id="bouquet-frame" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
</div>

<script>
  window.openBouquetModal = function() {
    var m = document.getElementById('bouquet-modal');
    var f = document.getElementById('bouquet-frame');
    if (m && f) {
      f.src = './bouquet.html';
      m.style.display = 'block';
    }
  };
  window.closeBouquetModal = function() {
    var m = document.getElementById('bouquet-modal');
    var f = document.getElementById('bouquet-frame');
    if (m && f) {
      m.style.display = 'none';
      f.src = 'about:blank';
    }
  };
  window.addEventListener('message', function(e) {
    if (e.data === 'close-bouquet') {
      window.closeBouquetModal();
    }
  });
</script>
